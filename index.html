<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Wars</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}

#startScreen,
#roundText,
#gameOverScreen,
#finalScreen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:20;
    color:white;
}

#startScreen{
    background:radial-gradient(circle,#190033,#000);
}

#startScreen h1{
    font-size:72px;
    color:#00eaff;
    margin-bottom:25px;
    text-shadow:0 0 30px #00eaff;
}

#playerName{
    padding:16px;
    width:320px;
    border:none;
    outline:none;
    border-radius:14px;
    font-size:22px;
    text-align:center;
}

button{
    margin-top:20px;
    padding:14px 40px;
    border:none;
    border-radius:12px;
    background:#00eaff;
    color:black;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

#roundText{
    display:none;
    font-size:85px;
    font-weight:bold;
    text-shadow:0 0 25px white;
}

#gameOverScreen{
    display:none;
    background:rgba(0,0,0,0.88);
}

#gameOverScreen h1{
    font-size:90px;
    color:red;
}

#finalScreen{
    display:none;
    background:rgba(0,0,0,0.92);
}

#finalScreen h1{
    font-size:90px;
    color:#00ffcc;
}

#finalScore{
    font-size:50px;
    margin-top:20px;
}

#hud{
    position:absolute;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:20px 30px;
    color:white;
    font-size:32px;
    font-weight:bold;
    z-index:10;
}

#lives{
    position:absolute;
    top:70px;
    left:30px;
    color:#ff5555;
    font-size:28px;
    font-weight:bold;
    z-index:10;
}

#gunStatus{
    position:absolute;
    top:70px;
    right:30px;
    color:#00ff99;
    font-size:26px;
    font-weight:bold;
    z-index:10;
}

#controls{
    position:absolute;
    bottom:25px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:25px;
    z-index:10;
}

.controlBtn{
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid white;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:40px;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
    backdrop-filter:blur(5px);
}

</style>
</head>
<body>

<div id="startScreen">
    <h1>GALAXY HOVERBOARD WARS</h1>
    <input type="text" id="playerName" placeholder="Enter Your Name">
    <button onclick="startGame()">START GAME</button>
</div>

<div id="roundText"></div>

<div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <button onclick="restartRound()">Restart Round</button>
</div>

<div id="finalScreen">
    <h1>MISSION COMPLETE</h1>
    <div id="winnerName"></div>
    <div id="finalScore"></div>
</div>

<div id="hud">
    <div id="score">Score: 0</div>
    <div id="usernameHUD"></div>
</div>

<div id="lives">Lives: 3</div>
<div id="gunStatus"></div>

<div id="controls">
    <div class="controlBtn" id="leftBtn">◀</div>
    <div class="controlBtn" id="rightBtn">▶</div>
    <div class="controlBtn" id="shootBtn">✦</div>
</div>

<canvas id="gameCanvas"></canvas>

<audio id="bgMusic" preload="auto" loop crossorigin="anonymous">
<source src="https://raw.githubusercontent.com/jnit005/galaxyfighter/main/Apogee%20_%20Empyrion%20-%20Galactic%20Survival%20_%20Official%20Soundtrack.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const bgMusic = document.getElementById("bgMusic");

let score = 0;
let round = 1;
let lives = 3;
let timer = 45;
let gameStarted = false;
let playerName = "";
let obstacles = [];
let bullets = [];
let fireworks = [];
let stars = [];
let nebulaParticles = [];
let keys = {};
let leftPressed = false;
let rightPressed = false;

let gunPower = false;
let gunTimer = 0;
let gunItem = null;
let gunSpawned = false;

const player = {
    x: canvas.width/2,
    y: canvas.height - 180,
    width: 85,
    height: 120,
    speed: 10
};

for(let i=0;i<550;i++){

    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*2.5,
        speed:Math.random()*5+1
    });
}

for(let i=0;i<35;i++){

    nebulaParticles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        radius:120 + Math.random()*200,
        color:[
            "rgba(0,120,255,0.08)",
            "rgba(255,0,150,0.08)",
            "rgba(255,80,0,0.07)",
            "rgba(0,255,180,0.06)"
        ][Math.floor(Math.random()*4)]
    });
}

function startGame(){

    playerName = document.getElementById("playerName").value.trim();

    if(playerName === ""){
        alert("Enter player name");
        return;
    }

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("usernameHUD").innerText = playerName;

    // FIXED AUDIO
    bgMusic.volume = 0.45;

    const playPromise = bgMusic.play();

    if(playPromise !== undefined){
        playPromise.catch(()=>{});
    }

    startRound(round);
}

function startRound(r){

    obstacles = [];
    bullets = [];
    gunItem = null;
    gunSpawned = false;
    gunPower = false;
    timer = 45;
    lives = 3;

    updateLives();

    showRound("ROUND " + r);

    setTimeout(()=>{

        gameStarted = true;

        requestAnimationFrame(gameLoop);

        roundTimer = setInterval(()=>{

            timer--;

            if(timer === 22 && !gunSpawned){
                spawnGun();
            }

            if(timer <= 0){
                nextRound();
            }

        },1000);

    },2200);
}

function showRound(text){

    const rt = document.getElementById("roundText");

    rt.innerText = text;
    rt.style.display = "flex";

    setTimeout(()=>{
        rt.style.display = "none";
    },2000);
}

function gameLoop(){

    if(!gameStarted) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGalaxy();

    movePlayer();

    drawPlayer();

    spawnObstacle();

    updateObstacles();

    updateBullets();

    updateGun();

    if(gunPower){

        gunTimer--;

        document.getElementById("gunStatus").innerText =
            "BLASTER : " + Math.floor(gunTimer/60) + "s";

        if(gunTimer <= 0){

            gunPower = false;

            document.getElementById("gunStatus").innerText = "";
        }
    }

    requestAnimationFrame(gameLoop);
}

function drawGalaxy(){

    let gradient = ctx.createLinearGradient(0,0,0,canvas.height);

    gradient.addColorStop(0,"#000010");
    gradient.addColorStop(1,"#130021");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // realistic nebula

    nebulaParticles.forEach(n=>{

        let g = ctx.createRadialGradient(
            n.x,n.y,20,
            n.x,n.y,n.radius
        );

        g.addColorStop(0,n.color);
        g.addColorStop(1,"rgba(0,0,0,0)");

        ctx.fillStyle = g;

        ctx.beginPath();
        ctx.arc(n.x,n.y,n.radius,0,Math.PI*2);
        ctx.fill();
    });

    // spiral galaxy

    ctx.save();

    ctx.translate(canvas.width/2, canvas.height/2);

    ctx.rotate(Date.now()*0.00004);

    for(let i=0;i<250;i++){

        let angle = i * 0.35;
        let radius = i * 2;

        let x = Math.cos(angle)*radius;
        let y = Math.sin(angle)*radius;

        ctx.fillStyle = "rgba(255,255,255,0.06)";

        ctx.beginPath();
        ctx.arc(x,y,1.8,0,Math.PI*2);
        ctx.fill();
    }

    ctx.restore();

    // moving stars

    for(let star of stars){

        ctx.beginPath();
        ctx.arc(star.x,star.y,star.size,0,Math.PI*2);

        ctx.fillStyle = "white";
        ctx.fill();

        star.y += star.speed;

        if(star.y > canvas.height){

            star.y = 0;
            star.x = Math.random()*canvas.width;
        }
    }

    // glowing planet

    let planetGlow = ctx.createRadialGradient(
        canvas.width-130,
        130,
        20,
        canvas.width-130,
        130,
        100
    );

    planetGlow.addColorStop(0,"#ffdd66");
    planetGlow.addColorStop(1,"rgba(255,120,0,0)");

    ctx.fillStyle = planetGlow;

    ctx.beginPath();
    ctx.arc(canvas.width-130,130,100,0,Math.PI*2);
    ctx.fill();
}

function movePlayer(){

    if(keys["ArrowLeft"] || leftPressed){
        player.x -= player.speed;
    }

    if(keys["ArrowRight"] || rightPressed){
        player.x += player.speed;
    }

    player.x = Math.max(0, Math.min(canvas.width-player.width, player.x));
}

function drawPlayer(){

    // hoverboard glow

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#00eaff";

    let hoverGradient = ctx.createLinearGradient(
        player.x,
        player.y+95,
        player.x+100,
        player.y+95
    );

    hoverGradient.addColorStop(0,"#00eaff");
    hoverGradient.addColorStop(1,"#0044ff");

    ctx.fillStyle = hoverGradient;

    ctx.beginPath();
    ctx.roundRect(player.x-10,player.y+90,110,16,12);
    ctx.fill();

    ctx.shadowBlur = 0;

    // legs

    ctx.fillStyle = "#2955ff";
    ctx.fillRect(player.x+24,player.y+52,18,42);
    ctx.fillRect(player.x+46,player.y+52,18,42);

    // shoes

    ctx.fillStyle = "#fff";
    ctx.fillRect(player.x+22,player.y+88,20,8);
    ctx.fillRect(player.x+46,player.y+88,20,8);

    // jacket

    let jacket = ctx.createLinearGradient(
        player.x,
        player.y,
        player.x+60,
        player.y+50
    );

    jacket.addColorStop(0,"#101010");
    jacket.addColorStop(1,"#444");

    ctx.fillStyle = jacket;
    ctx.fillRect(player.x+16,player.y+10,50,48);

    // backpack

    ctx.fillStyle = "#111";
    ctx.fillRect(player.x+8,player.y+16,16,34);

    // arms

    ctx.fillStyle = "#dba27b";
    ctx.fillRect(player.x+8,player.y+18,12,30);
    ctx.fillRect(player.x+64,player.y+18,12,30);

    // neck

    ctx.fillRect(player.x+34,player.y+2,10,10);

    // face

    ctx.beginPath();
    ctx.arc(player.x+40,player.y,18,0,Math.PI*2);
    ctx.fillStyle = "#f2c19b";
    ctx.fill();

    // cap

    ctx.fillStyle = "#ff003c";
    ctx.fillRect(player.x+23,player.y-14,34,11);

    ctx.fillRect(player.x+50,player.y-10,14,5);

    // eyes

    ctx.fillStyle = "black";
    ctx.fillRect(player.x+34,player.y-2,3,3);
    ctx.fillRect(player.x+44,player.y-2,3,3);
}

function spawnObstacle(){

    // MORE realistic traffic

    let rate = 0.04 + (round*0.012);

    if(Math.random() < rate){

        let type = ["asteroid","comet","alien"]
        [Math.floor(Math.random()*3)];

        obstacles.push({
            x:Math.random()*(canvas.width-120),
            y:-120,
            width:90,
            height:90,
            speed:5 + round*1.3,
            type:type,
            rotation:Math.random()*360
        });
    }
}

function updateObstacles(){

    for(let i=obstacles.length-1;i>=0;i--){

        let o = obstacles[i];

        o.y += o.speed;
        o.rotation += 2;

        ctx.save();

        ctx.translate(o.x,o.y);
        ctx.rotate(o.rotation*Math.PI/180);

        // REALISTIC ASTEROID

        if(o.type === "asteroid"){

            ctx.beginPath();

            for(let a=0;a<12;a++){

                let angle = (Math.PI*2/12)*a;
                let radius = 38 + Math.random()*10;

                ctx.lineTo(
                    Math.cos(angle)*radius,
                    Math.sin(angle)*radius
                );
            }

            let rock = ctx.createRadialGradient(0,0,10,0,0,50);

            rock.addColorStop(0,"#9b9b9b");
            rock.addColorStop(1,"#353535");

            ctx.fillStyle = rock;
            ctx.fill();
        }

        // REALISTIC COMET

        else if(o.type === "comet"){

            let tail = ctx.createLinearGradient(-120,0,20,0);

            tail.addColorStop(0,"rgba(255,120,0,0)");
            tail.addColorStop(1,"rgba(255,220,120,0.9)");

            ctx.fillStyle = tail;
            ctx.fillRect(-130,-14,130,28);

            let fire = ctx.createRadialGradient(0,0,5,0,0,35);

            fire.addColorStop(0,"#fff7aa");
            fire.addColorStop(0.5,"#ff9933");
            fire.addColorStop(1,"#ff4400");

            ctx.fillStyle = fire;

            ctx.beginPath();
            ctx.arc(0,0,34,0,Math.PI*2);
            ctx.fill();
        }

        // REALISTIC SPACESHIP

        else{

            let ship = ctx.createLinearGradient(-50,0,50,0);

            ship.addColorStop(0,"#2f2f2f");
            ship.addColorStop(0.5,"#8d8d8d");
            ship.addColorStop(1,"#2f2f2f");

            ctx.fillStyle = ship;

            ctx.beginPath();
            ctx.ellipse(0,0,50,20,0,0,Math.PI*2);
            ctx.fill();

            ctx.fillStyle = "#9dfdff";

            ctx.beginPath();
            ctx.arc(0,-10,14,0,Math.PI*2);
            ctx.fill();

            ctx.fillStyle = "#00eaff";

            ctx.beginPath();
            ctx.arc(-25,8,5,0,Math.PI*2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(25,8,5,0,Math.PI*2);
            ctx.fill();
        }

        ctx.restore();

        if(collision(player,o)){

            lives--;

            updateLives();

            obstacles.splice(i,1);

            if(lives <=0){
                gameOver();
            }
        }

        if(o.y > canvas.height+100){

            obstacles.splice(i,1);

            score++;

            updateScore();
        }
    }
}

function collision(a,b){

    return(
        a.x < b.x + 50 &&
        a.x + a.width > b.x - 50 &&
        a.y < b.y + 50 &&
        a.y + a.height > b.y - 50
    );
}

function updateScore(){
    document.getElementById("score").innerText = "Score: " + score;
}

function updateLives(){
    document.getElementById("lives").innerText = "Lives: " + lives;
}

function gameOver(){

    clearInterval(roundTimer);

    gameStarted = false;

    document.getElementById("gameOverScreen").style.display = "flex";
}

function restartRound(){

    document.getElementById("gameOverScreen").style.display = "none";

    startRound(round);
}

function nextRound(){

    clearInterval(roundTimer);

    gameStarted = false;

    if(round < 3){

        round++;

        player.speed += 1;

        startRound(round);
    }
    else{
        finalCelebration();
    }
}

function spawnGun(){

    gunSpawned = true;

    gunItem = {
        x:Math.random()*(canvas.width-120),
        y:-50
    };
}

function updateGun(){

    if(gunItem){

        gunItem.y += 5;

        ctx.save();

        ctx.translate(gunItem.x,gunItem.y);

        // realistic gun

        let gunGradient = ctx.createLinearGradient(0,0,70,0);

        gunGradient.addColorStop(0,"#1e1e1e");
        gunGradient.addColorStop(1,"#555");

        ctx.fillStyle = gunGradient;
        ctx.fillRect(0,0,70,14);

        ctx.fillStyle = "#00eaff";
        ctx.fillRect(48,3,22,8);

        ctx.fillStyle = "#333";
        ctx.fillRect(18,14,12,24);

        ctx.fillStyle = "#888";
        ctx.fillRect(6,-5,18,5);

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00ffff";

        ctx.fillStyle = "#00ffff";
        ctx.fillRect(48,2,18,10);

        ctx.restore();

        if(
            player.x < gunItem.x+70 &&
            player.x+player.width > gunItem.x &&
            player.y < gunItem.y+30 &&
            player.y+player.height > gunItem.y
        ){

            gunPower = true;
            gunTimer = 60*15;
            gunItem = null;
        }
    }
}

function shootBullet(){

    bullets.push({
        x:player.x+40,
        y:player.y,
        speed:15
    });
}

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        let b = bullets[i];

        b.y -= b.speed;

        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00ffff";

        ctx.fillStyle = "#00ffff";
        ctx.fillRect(b.x,b.y,6,24);

        ctx.shadowBlur = 0;

        for(let j=obstacles.length-1;j>=0;j--){

            let o = obstacles[j];

            if(
                b.x < o.x+50 &&
                b.x > o.x-50 &&
                b.y < o.y+50 &&
                b.y > o.y-50
            ){

                obstacles.splice(j,1);
                bullets.splice(i,1);

                score++;

                updateScore();

                break;
            }
        }
    }
}

function finalCelebration(){

    document.getElementById("finalScreen").style.display = "flex";

    document.getElementById("winnerName").innerHTML =
        "<h2>"+playerName+"</h2>";

    document.getElementById("finalScore").innerHTML =
        "FINAL SCORE : " + score;

    setInterval(()=>{

        for(let i=0;i<100;i++){

            fireworks.push({
                x:Math.random()*canvas.width,
                y:Math.random()*canvas.height/2,
                radius:Math.random()*4,
                dx:(Math.random()-0.5)*8,
                dy:(Math.random()-0.5)*8,
                alpha:1
            });
        }

    },500);

    animateFireworks();
}

function animateFireworks(){

    function loop(){

        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        for(let i=fireworks.length-1;i>=0;i--){

            let f = fireworks[i];

            ctx.beginPath();

            ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);

            ctx.fillStyle =
            `rgba(${Math.random()*255},
            ${Math.random()*255},
            ${Math.random()*255},
            ${f.alpha})`;

            ctx.fill();

            f.x += f.dx;
            f.y += f.dy;

            f.alpha -= 0.01;

            if(f.alpha <=0){
                fireworks.splice(i,1);
            }
        }

        requestAnimationFrame(loop);
    }

    loop();
}

document.addEventListener("keydown",e=>{

    keys[e.key] = true;

    if(e.key === " " && gunPower){
        shootBullet();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key] = false;
});

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");
const shootBtn = document.getElementById("shootBtn");

leftBtn.onmousedown = ()=> leftPressed = true;
leftBtn.onmouseup = ()=> leftPressed = false;

rightBtn.onmousedown = ()=> rightPressed = true;
rightBtn.onmouseup = ()=> rightPressed = false;

leftBtn.ontouchstart = ()=> leftPressed = true;
leftBtn.ontouchend = ()=> leftPressed = false;

rightBtn.ontouchstart = ()=> rightPressed = true;
rightBtn.ontouchend = ()=> rightPressed = false;

shootBtn.onclick = ()=>{

    if(gunPower){
        shootBullet();
    }
};

window.addEventListener("resize",()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

</script>

</body>
</html>

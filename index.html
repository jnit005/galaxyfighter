<!-- 2. REPLACE drawGalaxyBackground FUNCTION -->
<!-- ========================================= -->

<script>

function drawGalaxyBackground(){

    // deep space base
    let gradient = ctx.createLinearGradient(0,0,0,canvas.height);

    gradient.addColorStop(0,"#02010f");
    gradient.addColorStop(0.3,"#090022");
    gradient.addColorStop(0.6,"#13002f");
    gradient.addColorStop(1,"#02010f");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // blue nebula
    let nebula1 = ctx.createRadialGradient(
        canvas.width*0.2,
        canvas.height*0.3,
        50,
        canvas.width*0.2,
        canvas.height*0.3,
        500
    );

    nebula1.addColorStop(0,"rgba(0,180,255,0.28)");
    nebula1.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = nebula1;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // red nebula
    let nebula2 = ctx.createRadialGradient(
        canvas.width*0.8,
        canvas.height*0.4,
        50,
        canvas.width*0.8,
        canvas.height*0.4,
        450
    );

    nebula2.addColorStop(0,"rgba(255,50,80,0.24)");
    nebula2.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = nebula2;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // purple galaxy
    let nebula3 = ctx.createRadialGradient(
        canvas.width*0.5,
        canvas.height*0.7,
        80,
        canvas.width*0.5,
        canvas.height*0.7,
        600
    );

    nebula3.addColorStop(0,"rgba(150,0,255,0.22)");
    nebula3.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle = nebula3;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // moving stars
    for(let star of stars){

        ctx.beginPath();

        ctx.fillStyle = "white";

        ctx.arc(star.x,star.y,star.size,0,Math.PI*2);

        ctx.fill();

        star.y += star.speed;

        if(star.y > canvas.height){

            star.y = 0;
            star.x = Math.random()*canvas.width;
        }
    }

    // distant galaxies
    ctx.save();

    ctx.translate(canvas.width*0.75, canvas.height*0.22);

    ctx.rotate(Date.now()*0.00005);

    for(let i=0;i<25;i++){

        ctx.beginPath();

        ctx.strokeStyle = `rgba(180,180,255,${0.02+i*0.003})`;

        ctx.arc(0,0,i*8,0,Math.PI*1.7);

        ctx.stroke();
    }

    ctx.restore();
}

</script>

<script>

function drawPlayer(){

    ctx.save();

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#00eaff";

    ctx.drawImage(
        playerImg,
        player.x - 15,
        player.y - 25,
        115,
        145
    );

    ctx.restore();
}

</script>

<script>

function spawnObstacle(){

    // slightly increased frequency
    let rate = 0.032 + (round*0.010);

    if(Math.random() < rate){

        let types = ["asteroid","comet","alien"];

        let type = types[Math.floor(Math.random()*types.length)];

        obstacles.push({
            x:Math.random()*(canvas.width-100),
            y:-120,
            width:90,
            height:90,
            speed:5.5 + round*1.25,
            type:type,
            rotate:Math.random()*360
        });
    }
}

</script>


<!-- ========================================= -->
<!-- 5. REPLACE updateObstacles FUNCTION -->
<!-- ========================================= -->

<script>

function updateObstacles(){

    for(let i=obstacles.length-1;i>=0;i--){

        let o = obstacles[i];

        o.y += o.speed;
        o.rotate += 1.5;

        ctx.save();

        ctx.translate(o.x,o.y);

        ctx.rotate(o.rotate * Math.PI/180);

        if(o.type === "asteroid"){

            ctx.drawImage(
                asteroidImg,
                -45,
                -45,
                90,
                90
            );
        }

        else if(o.type === "comet"){

            ctx.drawImage(
                cometImg,
                -75,
                -40,
                150,
                80
            );
        }

        else{

            ctx.drawImage(
                spaceshipImg,
                -55,
                -40,
                110,
                80
            );
        }

        ctx.restore();

        if(collision(player,o)){

            lives--;

            updateLives();

            obstacles.splice(i,1);

            if(lives <=0){
                gameOver();
            }
        }

        if(o.y > canvas.height+120){

            obstacles.splice(i,1);

            score++;

            updateScore();
        }
    }
}

</script>

<!-- 6. REPLACE updateGun FUNCTION -->

<script>

function updateGun(){

    if(gunItem){

        gunItem.y += 5;

        ctx.save();

        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00ffff";

        ctx.drawImage(
            gunImg,
            gunItem.x,
            gunItem.y,
            90,
            45
        );

        ctx.restore();

        if(
            player.x < gunItem.x+90 &&
            player.x+player.width > gunItem.x &&
            player.y < gunItem.y+45 &&
            player.y+player.height > gunItem.y
        ){

            gunPower = true;

            gunTimer = 60*15;

            gunItem = null;
        }
    }
}

</script>
